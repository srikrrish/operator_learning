simu:
  picFile: 3D_mini_apps_test/training_data/3D_PIF_PIC_BH_5_mini_apps_unnormalized.h5
  nDim: 3

sample:
  iEnd: 600
  step: 1

data:
  dataClass: pic
  outType: solution
  outScaling: 1
  space_dim: 3
  xStep: 1
  yStep: 1
  zStep: 1
  seed: null
  dataFile: 3D_mini_apps_test/training_data/PIF_PIC_BH_3D_5_mini_apps_QL_normalized.h5
  trainRatio: 0.8
  batchSize:  12       # Global Batch size 
  val_batchSize: 1     # validation local Batch size 
  sampling_mode: None  # [fixed, ordered, random]
 

model:
  da: 3
  du: 3
  dv: 32
  kX: 16
  kY: 16
  kZ: 16
  n_dims: 3
  n_layers: 4
  bias: false
  non_linearity: gelu
  scaling_layers: 2
  use_postfnochannel_mlp: false
  channel_mlp_expansion: 4
  use_skip_connection: false
  skip_type: soft-gating
  use_dse: true                        # Direct Spectral Evaluation
  use_kb: false                        # Kaiser-Bessel NUFFT
  use_toeplitz: false                  # Toeplitz NUFFT
  matrix_free: true

optim:
  name: adam
  lr: 1.0e-3
  weight_decay: 1.0e-4

lr_scheduler:
  # scheduler: CosAnnealingLR
  # T_max: 50000
  scheduler: StepLR
  step_size: 50.0
  gamma: 0.5

loss:
  name: L1Loss
  # absolute: false
  
parallel_strategy:
  ddp: false        # Distributed Data Parallel
  tp : false       # Tensor Parallel(Only for PIC-DSE)
  tp_size: 1       # must be divisible by nParticle          
  gpus_per_node: 4

train:
  trainDir: 3D_mini_apps_test/Penning_trap_test/model 
  epochs: 250                     # nEpochs
  #checkpoint: 3D_mini_apps_test/training/model/model_epoch300.pt   
  checkpoint: None   
  saveInterval: 50
  disableTensorboard: true

eval:
  runId: 1
  imgExt: png
  evalDir: 3D_mini_apps_test/computational_complexity 
  dim: 3
  kc : 0.5
  NG : 16
  T: 1.0
  dt: 0.05
  Vt: 1
  nParticle: 16384
  Qm : -1
  alpha: 0.05
  testCase: weakLandau
  ref: pic
  ml_time_int: explicit
  #predOnly: true
  
profile:
  enableProfiler: false
  profiler: nsys
  profileDir: nsysProf
  evalOnly: true
  input_shape: [1,3,10000]   # relevant only if evalOnly=true or compile_eval=true
  use_amp: 0
  use_complex_amp: 0
  benchmark: true
  niter: 5
  compile_eval: 0       
  compile_train: 0
  compile_mode: default    # compiler mode 
 
