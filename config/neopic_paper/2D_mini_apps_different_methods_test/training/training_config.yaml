simu:
  picFile: 2D_mini_apps_different_methods_test/training_data/2D_PIF_PIC_BH_5_mini_apps_unnormalized.h5
  nDim: 2

sample:
  iEnd: 600
  step: 1

data:
  dataClass: pic
  outType: solution
  outScaling: 1
  space_dim: 2
  xStep: 1
  yStep: 1
  zStep: 1
  seed: null
  dataFile: 2D_mini_apps_different_methods_test/training_data/PIF_PIC_BH_2D_5_mini_apps_QL_normalized.h5
  trainRatio: 0.8
  batchSize:  12        # Global Batch size 
  val_batchSize: 1     # validation local Batch size 
  sampling_mode: None  # [fixed, ordered, random]
 

model:
  da: 2
  du: 2
  dv: 32
  kX: 16
  kY: 16
  kZ: None
  n_dims: 2
  n_layers: 4
  bias: false
  non_linearity: gelu
  scaling_layers: 2
  use_postfnochannel_mlp: false
  channel_mlp_expansion: 4
  use_skip_connection: false
  skip_type: soft-gating
  use_dse: true                        # Direct Spectral Evaluation
  use_kb: false                          # Kaiser-Bessel NUFFT
  use_toeplitz: false                   # Toeplitz NUFFT
  matrix_free: false


optim:
  name: adam
  lr: 1.0e-3
  weight_decay: 1.0e-4

lr_scheduler:
  # scheduler: CosAnnealingLR
  # T_max: 50000
  scheduler: StepLR
  step_size: 50.0
  gamma: 0.5

loss:
  name: L1Loss
  # absolute: false
  
parallel_strategy:
  ddp: true        # Distributed Data Parallel
  tp : false        # Tensor Parallel(Only for PIC-DSE)
  tp_size: 1       # must be divisible by nParticle          
  gpus_per_node: 4

train:
  trainDir: 2D_mini_apps_different_methods_test/training/model
  epochs: 500                     # nEpochs
  checkpoint: None   
  saveInterval: 50
  disableTensorboard: true

eval:
  runId: 1
  imgExt: png
  evalDir: particle_weakLandau/50k/eval_800k
  dim: 2
  kc : 0.5
  NG : 32
  T: 30.0
  dt: 0.05
  Vt: 1
  nParticle: 800000
  Qm : -1
  alpha: 0.05
  testCase: weakLandau
  ref: pif
  ml_time_int: explicit
  
profile:
  enableProfiler: false
  profiler: nsys
  profileDir: nsysProf
  evalOnly: true
  input_shape: [1,3,10000]   # relevant only if evalOnly=true or compile_eval=true
  use_amp: 0
  use_complex_amp: 0
  benchmark: true
  niter: 5
  compile_eval: 0       
  compile_train: 0
  compile_mode: default    # compiler mode 
 
